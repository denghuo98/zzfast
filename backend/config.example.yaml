# ZZFast 配置文件模板
# 复制此文件为 config.yaml 并根据环境修改
# 注意：config.yaml 已被 .gitignore 忽略，不会提交到仓库

server:
  address: ":8000"
  serverRoot: "public"
  serverAgent: "zzfast"

# 数据库配置（至少配置一个，否则使用 SQLite 本地文件 zzfast.db）
# database:
#   default:
#     link: "mysql:root:password@tcp(127.0.0.1:3306)/zzfast?charset=utf8mb4&parseTime=true&loc=Local"

# 系统核心配置
system:
  # 运行模式：dev | test | staging | prod（默认 prod）
  mode: "dev"

  # 缓存配置
  cache:
    adapter: "file"        # file | memory | redis
    fileDir: "tmp/cache"   # file adapter 时生效

  # JWT Token 认证配置
  token:
    secretKey: "please-change-this-secret-key-to-32-bytes-minimum!!!"   # 至少32位，生产环境务必修改！
    expires: 86400         # 过期时间（秒）
    refreshInterval: 3600  # 自动刷新间隔（秒）
    maxRefreshTimes: 10    # 最大刷新次数，-1 表示不限
    multiLogin: true       # 是否允许多端同时登录
    autoRefresh: true      # 是否自动刷新

  # 超级管理员配置（密码请使用 bcrypt 或至少修改默认值）
  superAdmin:
    username: "superAdmin"         # 默认用户名
    password: "请修改为强密码"      # 生产环境务必修改！

  # 匿名身份访问（启用后全站免鉴权，仅适合演示/开发）
  anonymous:
    enabled: false
    identity:
      username: "anonymous"
      realName: "游客"

  # 文件上传配置
  upload:
    drive: "local"         # local | cos | oss | minio
    fileSize: 50           # 文件大小限制（MB）
    fileType: "doc,docx,dot,xls,xlsx,xltx,ppt,pptx,pdf,txt,csv,html,xml,pptm,md"
    imageSize: 10          # 图片大小限制（MB）
    imageType: "jpg,png,jpeg,gif,webp"
    localPath: "upload-files-"  # 本地存储路径前缀
    cosSecretId: ""
    cosSecretKey: ""
    cosBucketURL: ""
    cosPath: "attachment/"
    ossSecretId: ""
    ossSecretKey: ""
    ossEndpoint: ""
    ossBucketURL: ""
    ossPath: "attachment/"
    ossBucket: ""
    minioAccessKey: ""
    minioSecretKey: ""
    minioEndpoint: ""
    minioUseSSL: 0
    minioPath: "attachment/"
    minioBucket: ""
    minioDomain: ""

  # 验证码策略（短信验证码，用于登录、高危操作等场景校验）
  verifyCode:
    enabled: false
    secret: ""             # 验证码哈希密钥，留空复用 system.token.secretKey
    length: 6              # 验证码长度
    ttl: 300               # 有效期（秒）
    cooldown: 60           # 同场景同手机号重发间隔（秒）
    maxAttempts: 5         # 最大错误次数
    maxIpDaily: 20         # 同 IP 单场景每日发送上限
    maxMobileDaily: 10     # 同手机号单场景每日发送上限
    # trustedProxies:      # 可信代理 IP/CIDR；默认仅信任本机回环，内网代理需显式配置，否则跳过 IP 限流
    #   - "10.0.0.0/8"
    #   - "203.0.113.10"
    scenes:
      - scene: "login"
        name: "登录验证"
        template: "SMS_000000000"   # 短信模板 ID
        authOnly: false             # 登录前使用
        requireCaptcha: true        # 发送前校验图形验证码
        allowTargetInput: false
      - scene: "high_risk"
        name: "高危操作验证"
        template: "SMS_000000001"
        authOnly: true              # 仅登录后使用
        requireCaptcha: false
        allowTargetInput: false     # 固定发送到当前账号绑定的手机号

  # 不需要鉴权的路由白名单（精确匹配，不含通配符）
  # 说明：/admin/site/* 等公共接口已在 AdminAuth 中间件之前绑定，天然免鉴权，无需在此列出。
  # 动态菜单 /admin/menu/dynamic 依赖登录态（按角色过滤菜单），不可匿名访问。
  # 仅当存在「绑定了 AdminAuth 但又需匿名访问」的路由时，才需在此添加（须写全 /admin 前缀）。
  # 例如希望该路由对任何登录用户放开（会同时跳过登录校验与 Casbin 权限校验，未登录请求也会进入控制器）：
  # exceptAuth:
  #   - "/admin/member/verify-code/send"
  exceptAuth: []

  # 请求加密密钥（AES-GCM，16/24/32字节，前后端保持一致），生产环境务必修改
  requestEncryptKey: "1234567890abcdef"

# 邮件通知配置（SMTP，可选；未配置或 enabled=false 时不会发送）
# 163 邮箱：password 填「SMTP 授权码」，不是登录密码
# mail:
#   enabled: true
#   host: "smtp.163.com"
#   port: 465
#   ssl: true
#   username: "your_account@163.com"
#   password: "SMTP授权码"
#   from: "your_account@163.com"
#   fromName: "系统通知"
#   to:
#     - "receive@example.com"
#   timeout: 10

# 短信配置（验证码发送通道，可选；未配置或 enabled=false 时不会发送）
# drive: mock | aliyun | tencent
# sms:
#   enabled: true
#   drive: "aliyun"
#   timeout: 10
#   signName: "ZZFast"
#   # 阿里云
#   aliyunAccessKeyId: ""
#   aliyunAccessKeySecret: ""
#   aliyunSignName: ""
#   # 腾讯云
#   tencentSecretId: ""
#   tencentSecretKey: ""
#   tencentSdkAppId: ""
#   tencentSignName: ""
#   tencentRegion: "ap-guangzhou"
#   tencentEndpoint: "sms.tencentcloudapi.com"

# 消息队列配置
queue:
  switch: true
  driver: "disk"           # 当前仅支持 disk，Redis/RocketMQ/Kafka 为预留扩展点
  groupName: "default"
  disk:
    path: "./tmp/diskqueue"
    batchSize: 100
    batchTime: 1            # 秒
    segmentSize: 10485760   # 10MB
    segmentLimit: 3000
